<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hugo Guerra-Garcia</title>
    <script>
      // GitHub Pages has no SPA fallback. Keep one path segment (/portfolio/)
      // and hand the rest to index.html, which restores the real route.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
